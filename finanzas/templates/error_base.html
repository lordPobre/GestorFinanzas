{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151412">
  <meta name="robots" content="noindex">
  <title>{% block title %}{% endblock %} · Fintora</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
  <link rel="alternate icon" href="{% static 'img/favicon.png' %}">
  <link rel="stylesheet" href="{% static 'vendor/fonts/fuentes.css' %}">
  <link rel="stylesheet" href="{% static 'css/errores.css' %}">
</head>
<body>
  <main class="er">
    <a class="er-marca" href="/"><img src="{% static 'img/favicon.svg' %}" alt="">Fintora</a>
    <div class="er-estado {% block tono %}ambar{% endblock %}"><b></b>{% block etiqueta %}{% endblock %}<span class="er-codigo">{% block codigo %}{% endblock %}</span></div>
    <h1>{% block titulo %}{% endblock %}</h1>
    <p>{% block texto %}{% endblock %}</p>
    <div class="er-acciones">{% block acciones %}<a class="er-btn principal" href="/">Ir al inicio</a>{% endblock %}</div>
  </main>
</body>
</html>
