<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>FinApp · Ingresar</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple:#a78bfa; --purple-dim:#7c3aed;
            --glass-bg:rgba(255,255,255,0.04);
            --glass-border:rgba(255,255,255,0.08);
            --text-primary:#f1f0ff;
            --text-muted:rgba(241,240,255,0.35);
            --surface:#0d0d1a;
        }
        * { box-sizing:border-box; margin:0; padding:0; }
        body {
            font-family:'DM Sans',sans-serif;
            background:var(--surface);
            color:var(--text-primary);
            min-height:100vh;
            display:flex; align-items:center; justify-content:center;
            padding:20px;
        }
        body::before {
            content:''; position:fixed; inset:0;
            background:
                radial-gradient(ellipse 80% 60% at 25% 15%, rgba(124,58,237,0.18) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 75% 85%, rgba(167,139,250,0.1) 0%, transparent 50%);
            pointer-events:none;
        }
        .card {
            width:100%; max-width:400px;
            background:var(--glass-bg);
            border:1px solid var(--glass-border);
            border-radius:24px; padding:40px;
            position:relative; z-index:1;
            backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);
        }
        .logo-wrap { display:flex; justify-content:center; margin-bottom:20px; }
        h1 { font-size:22px; font-weight:600; text-align:center; margin-bottom:5px; }
        .sub { font-size:13px; color:var(--text-muted); text-align:center; margin-bottom:32px; }
        label { display:block; font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.08em; font-weight:500; margin-bottom:8px; }
        input {
            width:100%; background:rgba(255,255,255,0.04);
            border:1px solid var(--glass-border); border-radius:12px;
            padding:13px 16px; color:var(--text-primary);
            font-family:'DM Sans',sans-serif; font-size:14px; outline:none;
            transition:border-color 0.2s, background 0.2s;
        }
        input:focus { border-color:rgba(167,139,250,0.45); background:rgba(124,58,237,0.06); }
        .field { margin-bottom:16px; }
        .err { background:rgba(248,113,113,0.1); border:1px solid rgba(248,113,113,0.2); border-radius:10px; padding:10px 14px; font-size:12px; color:#f87171; margin-bottom:16px; }
        .btn {
            width:100%; padding:13px;
            background:var(--purple-dim); color:#fff;
            border:none; border-radius:12px;
            font-size:14px; font-weight:500; cursor:pointer;
            font-family:'DM Sans',sans-serif;
            transition:background 0.2s; margin-top:8px;
        }
        .btn:hover { background:#6d28d9; }
        .footer { text-align:center; margin-top:24px; font-size:13px; color:var(--text-muted); }
        .footer a { color:var(--purple); text-decoration:none; }
    </style>
</head>
<body>
    <div class="card">

        <!-- LOGO -->
        <div class="logo-wrap">
            <svg xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 200 76"
                 style="width:200px;height:76px;display:block;overflow:visible">
                <defs>
                    <linearGradient id="lg-a" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#7c3aed"/>
                        <stop offset="100%" stop-color="#a78bfa"/>
                    </linearGradient>
                </defs>
                <!-- Tarjeta trasera -->
                <rect x="0" y="10" width="52" height="62" rx="11" fill="url(#lg-a)" opacity="0.45"/>
                <!-- Tarjeta delantera -->
                <rect x="10" y="2" width="52" height="62" rx="11" fill="url(#lg-a)"/>
                <!-- Pantalla interior -->
                <rect x="18" y="10" width="36" height="46" rx="6" fill="#0f172a"/>
                <!-- Líneas de datos -->
                <rect x="23" y="19" width="26" height="4" rx="2" fill="#a78bfa" opacity="0.9"/>
                <rect x="23" y="28" width="18" height="3" rx="1.5" fill="#f1f0ff" opacity="0.45"/>
                <rect x="23" y="36" width="22" height="3" rx="1.5" fill="#f1f0ff" opacity="0.3"/>
                <rect x="23" y="44" width="13" height="3" rx="1.5" fill="#34d399" opacity="0.8"/>
                <!-- Texto Fin -->
                <text x="74" y="38"
                      font-family="DM Sans, Arial, sans-serif"
                      font-size="32" font-weight="700"
                      fill="#f1f0ff">Fin</text>
                <!-- Texto App -->
                <text x="76" y="58"
                      font-family="DM Sans, Arial, sans-serif"
                      font-size="17" font-weight="500"
                      fill="#a78bfa" letter-spacing="3">App</text>
            </svg>
        </div>

        <p class="sub">Ingresa a tu gestor financiero</p>

        {% if form.errors %}
        <div class="err">Usuario o contraseña incorrectos</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="field">
                <label>Usuario</label>
                <input type="text" name="username" autocomplete="username" required autofocus>
            </div>
            <div class="field">
                <label>Contraseña</label>
                <input type="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn">Ingresar</button>
        </form>

        <div class="footer">
            ¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate</a>
        </div>
    </div>
</body>
</html>
