{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#191919">
  <title>{% block title %}Rekon{% endblock %}</title>

  <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
  <link rel="alternate icon" href="{% static 'img/favicon.png' %}">

  <link rel="stylesheet" href="{% static 'vendor/fonts/fuentes.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/finapp.css' %}">

</head>
<body class="legal">
  <div class="legal-ancho">

    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:30px">
      <a href="{% url 'dashboard' %}" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text-primary)">
        <img src="{% static 'img/favicon.svg' %}" alt="" width="26" height="26">
        <span style="font-size:16px;font-weight:800;letter-spacing:-.02em">Rekon</span>
      </a>
      <div style="display:flex;gap:8px">
        <a href="{% url 'privacidad' %}" class="btn btn-glass btn-sm">Privacidad</a>
        <a href="{% url 'terminos' %}" class="btn btn-glass btn-sm">Términos</a>
      </div>
    </div>

    <h1 class="page-title" style="margin:0 0 6px">{% block encabezado %}{% endblock %}</h1>
    <div class="hint" style="margin-bottom:26px">
      Versión {{ version }} · vigente desde {{ vigente_desde }}
    </div>

    <div class="legal-cuerpo">
      {% block cuerpo %}{% endblock %}
    </div>

    <div style="margin-top:44px;padding-top:22px;border-top:1px solid var(--line);display:flex;gap:14px;flex-wrap:wrap;align-items:center">
      <a href="{% url 'dashboard' %}" class="btn btn-glass btn-sm">Volver a la app</a>
      <span class="hint" style="font-size:12px">{{ responsable }} · {{ correo_contacto }}</span>
    </div>

  </div>
</body>
</html>
