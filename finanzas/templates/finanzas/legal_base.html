{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#191919">
  <title>{% block title %}Rekon{% endblock %}</title>

  <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
  <link rel="alternate icon" href="{% static 'img/favicon.png' %}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/finapp.css' %}">

  <style>
    .legal {
      font-family: 'Manrope', system-ui, sans-serif;
      background: var(--bg); color: var(--text-primary);
      min-height: 100vh; min-height: 100dvh;
    }
    .legal-ancho { max-width: 720px; margin: 0 auto; padding: 34px 22px 80px; }
    .legal-cuerpo { font-size: 14.5px; line-height: 1.72; color: var(--text-primary); }
    .legal-cuerpo h2 {
      margin: 38px 0 12px; font-size: 18px; font-weight: 800;
      letter-spacing: -.02em; color: var(--text-primary);
    }
    .legal-cuerpo h3 {
      margin: 26px 0 8px; font-size: 14.5px; font-weight: 700;
      color: var(--amber);
    }
    .legal-cuerpo p { margin: 0 0 14px; text-wrap: pretty; }
    .legal-cuerpo ul { margin: 0 0 16px; padding-left: 20px; }
    .legal-cuerpo li { margin-bottom: 7px; }
    .legal-cuerpo strong { font-weight: 700; }
    .legal-cuerpo table {
      width: 100%; border-collapse: collapse; margin: 0 0 18px; font-size: 13px;
    }
    .legal-cuerpo th, .legal-cuerpo td {
      text-align: left; padding: 10px 12px; vertical-align: top;
      border-bottom: 1px solid rgba(255, 255, 255, .07);
    }
    .legal-cuerpo th { font-weight: 700; color: var(--text-secondary); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; }

    @media (max-width: 560px) {
      .legal-ancho { padding: 22px 16px 60px; }
      .legal-cuerpo { font-size: 14px; }
      .legal-cuerpo table, .legal-cuerpo th, .legal-cuerpo td { font-size: 12.5px; }
      .legal-cuerpo th, .legal-cuerpo td { padding: 8px 9px; }
    }
  </style>
</head>
<body class="legal">
  <div class="legal-ancho">

    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:30px">
      <a href="{% url 'dashboard' %}" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text-primary)">
        <img src="{% static 'img/favicon.svg' %}" alt="" width="26" height="26">
        <span style="font-size:16px;font-weight:800;letter-spacing:-.02em">Rekon</span>
      </a>
      <div style="display:flex;gap:8px">
        <a href="{% url 'privacidad' %}" class="btn btn-glass btn-sm">Privacidad</a>
        <a href="{% url 'terminos' %}" class="btn btn-glass btn-sm">Términos</a>
      </div>
    </div>

    <h1 class="page-title" style="margin:0 0 6px">{% block encabezado %}{% endblock %}</h1>
    <div class="hint" style="margin-bottom:26px">
      Versión {{ version }} · vigente desde {{ vigente_desde }}
    </div>

    <div class="legal-cuerpo">
      {% block cuerpo %}{% endblock %}
    </div>

    <div style="margin-top:44px;padding-top:22px;border-top:1px solid rgba(255,255,255,.07);display:flex;gap:14px;flex-wrap:wrap;align-items:center">
      <a href="{% url 'dashboard' %}" class="btn btn-glass btn-sm">Volver a la app</a>
      <span class="hint" style="font-size:12px">{{ responsable }} · {{ correo_contacto }}</span>
    </div>

  </div>
</body>
</html>
