{% extends 'finanzas/base.html' %}
{% block nav_prestamos %}active{% endblock %}
{% block nav_prestamos_m %}active{% endblock %}

{% block content %}
<div style="width:100%;max-width:480px;margin:0 auto">
    <a href="{% url 'detalle_persona' persona.id %}" class="btn btn-glass" style="margin-bottom:24px;display:inline-flex">
        <i class="fas fa-arrow-left" style="font-size:12px"></i> Volver
    </a>

    <div class="glass" style="padding:28px">
        <h1 style="font-size:20px;font-weight:600;color:var(--text-primary);margin:0 0 6px">Nuevo préstamo</h1>
        <p style="font-size:13px;color:var(--text-muted);margin:0 0 24px">Para <strong style="color:var(--purple)">{{ persona.nombre }}</strong></p>

        <form method="POST">
            {% csrf_token %}

            <div class="field-group">
                <label class="field-label">¿Qué le prestaste? <span style="color:var(--red)">*</span></label>
                <input type="text" name="descripcion" class="field-input" placeholder="Ej: Préstamo efectivo, entrada concierto..." required autofocus>
            </div>

            <div class="field-group">
                <label class="field-label">Monto <span style="color:var(--red)">*</span></label>
                <input type="number" name="monto" class="field-input" placeholder="Ej: 50000" min="1" required>
            </div>

            <div class="field-group">
                <label class="field-label">¿Cómo te lo pagará?</label>
                <select name="tipo" id="tipoPrestamo" class="field-input" onchange="toggleCuotas()">
                    <option value="UNICO">De una vez (pago único)</option>
                    <option value="CUOTAS">En cuotas</option>
                </select>
            </div>

            <div class="field-group" id="cuotasWrap" style="display:none">
                <label class="field-label">¿En cuántas cuotas?</label>
                <input type="number" name="cuotas_totales" class="field-input" placeholder="Ej: 3" min="2" value="2">
                <div class="field-help" id="cuotaPreview"></div>
            </div>

            <button type="submit" class="btn btn-purple" style="width:100%;justify-content:center;padding:12px">
                <i class="fas fa-plus" style="font-size:13px"></i> Registrar préstamo
            </button>
        </form>
    </div>
</div>

<script>
function toggleCuotas() {
    const tipo = document.getElementById('tipoPrestamo').value;
    document.getElementById('cuotasWrap').style.display = tipo === 'CUOTAS' ? 'block' : 'none';
    actualizarPreview();
}
function actualizarPreview() {
    const monto = parseFloat(document.querySelector('[name=monto]').value) || 0;
    const cuotas = parseInt(document.querySelector('[name=cuotas_totales]').value) || 0;
    const prev = document.getElementById('cuotaPreview');
    if (monto > 0 && cuotas > 1) {
        const porCuota = Math.round(monto / cuotas);
        prev.textContent = `Cada cuota sería de {{ simbolo_moneda }}${porCuota.toLocaleString('es-CL')}`;
    } else {
        prev.textContent = '';
    }
}
document.querySelector('[name=monto]').addEventListener('input', actualizarPreview);
document.querySelector('[name=cuotas_totales]').addEventListener('input', actualizarPreview);
</script>
{% endblock %}
