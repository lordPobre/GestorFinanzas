{% load static %}<link rel="canonical" href="{{ sitio }}{{ ruta }}">
  <meta property="og:url" content="{{ sitio }}{{ ruta }}">
  <meta property="og:site_name" content="Fintora">
  <meta property="og:locale" content="es_CL">
  <meta property="og:image" content="{{ sitio }}{% static 'img/og-fintora.png' %}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Fintora: cuánto puedes gastar, sin planilla">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ sitio }}{% static 'img/og-fintora.png' %}">
  {% if m.google_verificacion %}<meta name="google-site-verification" content="{{ m.google_verificacion }}">{% endif %}
  {% if publica and m.plausible %}<script defer data-domain="{{ m.plausible }}" src="{{ m.plausible_src }}" nonce="{{ csp_nonce }}"></script>{% endif %}
  {% if pixeles %}<link rel="stylesheet" href="{% static 'css/consentimiento.css' %}">{% endif %}
