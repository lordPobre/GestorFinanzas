<span class="{{ clase }} marca-app" data-fondo="{{ m.fondo }}" data-tinta="{{ m.tinta }}">{% if m.d %}<svg class="marca-glifo" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="{{ m.d }}" fill="currentColor"></path></svg>{% elif m.fa %}<i class="{{ m.fa }}"></i>{% else %}<b>{{ m.letra }}</b>{% endif %}</span>
