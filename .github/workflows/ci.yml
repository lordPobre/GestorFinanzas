name: Control de calidad

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SECRET_KEY: clave-solo-para-pruebas-de-integracion-continua-no-sirve-en-produccion
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: postgres://fintora:fintora@localhost:5432/fintora
      DB_SSL: "0"
      PROXIES_CONFIABLES: "0"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Postgres 18
        run: |
          sudo systemctl stop postgresql || true
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18 postgresql-client-18
          if pg_lsclusters -h | awk '{print $1" "$2}' | grep -qx "18 main"; then
            sudo pg_ctlcluster 18 main stop || true
            sudo pg_conftool 18 main set port 5432
          else
            sudo pg_createcluster 18 main --port 5432
          fi
          sudo pg_ctlcluster 18 main start
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE fintora LOGIN SUPERUSER PASSWORD 'fintora';"
          sudo -u postgres createdb -O fintora fintora
          pg_isready -h localhost -p 5432
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Estilo, seguridad y errores evidentes
        run: ruff check .

      - name: Migraciones sin declarar
        run: python manage.py makemigrations --check --dry-run

      - name: Pruebas contra Postgres
        run: coverage run manage.py test --verbosity 2

      - name: Cobertura
        run: coverage report

      - name: Respaldo de prueba
        run: |
          python manage.py migrate --noinput
          python manage.py respaldar_postgres --seco

  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SECRET_KEY: clave-solo-para-pruebas-de-integracion-continua-no-sirve-en-produccion
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: postgres://fintora:fintora@localhost:5432/fintora
      DB_SSL: "0"
      PROXIES_CONFIABLES: "0"
      PRUEBAS_NAVEGADOR: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Postgres 18
        run: |
          sudo systemctl stop postgresql || true
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18 postgresql-client-18
          if pg_lsclusters -h | awk '{print $1" "$2}' | grep -qx "18 main"; then
            sudo pg_ctlcluster 18 main stop || true
            sudo pg_conftool 18 main set port 5432
          else
            sudo pg_createcluster 18 main --port 5432
          fi
          sudo pg_ctlcluster 18 main start
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE fintora LOGIN SUPERUSER PASSWORD 'fintora';"
          sudo -u postgres createdb -O fintora fintora
          pg_isready -h localhost -p 5432
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Chromium para Playwright
        run: python -m playwright install --with-deps chromium

      - name: Pruebas en navegador
        run: python manage.py test finanzas.tests.test_navegador --verbosity 2

  despliegue:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SECRET_KEY: clave-solo-para-pruebas-de-integracion-continua-no-sirve-en-produccion
      DEBUG: "False"
      ALLOWED_HOSTS: fintora.example
      CSRF_TRUSTED_ORIGINS: https://fintora.example

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      - name: Revision de despliegue
        run: python manage.py check --deploy --fail-level WARNING

  dependencias:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip

      - name: Vulnerabilidades conocidas
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt
          pip-audit --requirement requirements.txt --strict
          pip-audit --requirement requirements-dev.txt --strict

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Repositorio y Dockerfile
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: .cache
          exit-code: "1"

      - name: Construir la imagen del respaldo
        run: docker build -f railway/Dockerfile.respaldo -t fintora-respaldo:ci .

      - name: Imagen del respaldo
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: fintora-respaldo:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      
      - name: Origen de los hallazgos
        if: failure()
        run: |
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --format json fintora-respaldo:ci \
            | jq -r '.Results[] | .Target as $t | .Vulnerabilities[]? | "\(.PkgName) \(.InstalledVersion) \(.PkgPath // $t)"'
          docker run --rm --entrypoint sh fintora-respaldo:ci -c 'find / -xdev \( -name "*.spdx.json" -o -name "*.cdx.json" -o -path "*ensurepip/_bundled*" \) 2>/dev/null'

  secretos:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secretos en el historial
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Pruebas de JavaScript
        run: node --test pruebas_js/*.test.js
