name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # La suite corre con DEBUG=True a propósito: settings.py se niega a
      # arrancar en producción sin una SECRET_KEY real, y no queremos una
      # clave de verdad guardada en el repositorio ni en los secretos de CI
      # solo para correr tests contra una base temporal.
      DEBUG: 'True'
      SECRET_KEY: 'clave-solo-para-tests-de-integracion-continua'
      ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Comprobar que no faltan migraciones
        # Un modelo cambiado sin su migración correspondiente pasa todos los
        # tests en local y revienta en el despliegue. Esto lo detecta antes.
        run: python manage.py makemigrations --check --dry-run

      - name: Revisión de despliegue
        # Los avisos de seguridad de Django. No falla la construcción: con
        # DEBUG=True varios saltan por definición. Queda en el registro para
        # revisarlo.
        run: python manage.py check --deploy || true

      - name: Tests
        run: python manage.py test finanzas --verbosity 2
