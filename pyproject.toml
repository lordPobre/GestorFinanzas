[tool.ruff]
line-length = 110
target-version = "py313"
exclude = [
    "finanzas/migrations",
    "staticfiles",
    ".venv",
    "entrega-*",
]

[tool.ruff.lint]
select = [
    "E9",
    "F63",
    "F7",
    "F82",
    "F401",
    "F841",
    "S",
    "B",
    "DJ",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"core/settings.py" = ["F401", "S105"]
"finanzas/google_login.py" = ["S105", "S310"]
"finanzas/correo.py" = ["S310"]
"finanzas/push.py" = ["S310"]
"finanzas/voz.py" = ["S310"]
"finanzas/management/commands/respaldar_postgres.py" = ["S603"]
"finanzas/tests/*.py" = ["F841", "S101", "S105", "S106", "S108", "B018"]

[tool.coverage.run]
source = ["finanzas", "core"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "core/wsgi.py",
    "core/asgi.py",
]

[tool.coverage.report]
fail_under = 73
show_missing = true
skip_covered = true
