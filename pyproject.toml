[tool.ruff]
line-length = 110
target-version = "py313"
exclude = [
    "finanzas/migrations",
    "staticfiles",
    ".venv",
    "entrega-*",
]

[tool.ruff.lint]
select = [
    "E9",
    "F63",
    "F7",
    "F82",
    "F401",
    "F841",
]

[tool.ruff.lint.per-file-ignores]
"core/settings.py" = ["F401"]
"finanzas/tests/*.py" = ["F841", "S101", "S105", "S106"]

[tool.coverage.run]
source = ["finanzas", "core"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "core/wsgi.py",
    "core/asgi.py",
]

[tool.coverage.report]
fail_under = 55
show_missing = true
skip_covered = true
