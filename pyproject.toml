[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [
    "finanzas/migrations",
    "staticfiles",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E9",
    "F63",
    "F7",
    "F82",
    "F401",
    "F841",
]

[tool.ruff.lint.per-file-ignores]
"core/settings.py" = ["F401"]
"finanzas/tests*.py" = ["F841"]
